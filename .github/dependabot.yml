version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [gdamigos]
    commit-message:
      prefix: "chore(deps)"
    groups:
      charm:
        patterns: ["github.com/charmbracelet/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [gdamigos]
    commit-message:
      prefix: "chore(deps)"
    groups:
      release-actions:
        patterns:
          - "goreleaser/goreleaser-action"
          - "sigstore/cosign-installer"
          - "anchore/sbom-action*"
          - "docker/*"
          - "actions/attest-build-provenance"
      ci-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    assignees: [gdamigos]
    commit-message:
      prefix: "chore(deps)"
