name: CI

on:
  push:
    # bot branches always get a PR, so CI runs there already
    branches: ["**", "!dependabot/**", "!todo/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-only PRs
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # never fail here: a failed job would skip everything after it, and skipped counts as passed
          if ! files="$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if grep -qvE '^(docs/.*|.*\.md|LICENSE)$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs only, skipping build, tests and lint"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Docs only, nothing to test
        if: env.CODE != 'true'
        run: echo "skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CODE == 'true'
        with:
          go-version-file: go.mod
      - name: Verify modules
        if: env.CODE == 'true'
        run: go mod verify
      - name: Build
        if: env.CODE == 'true'
        run: go build -trimpath ./...
      - name: Test
        if: env.CODE == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test -count=1 -coverprofile=coverage.out ./...
          else
            go test -count=1 -race -coverprofile=coverage.out ./...
          fi
      - name: Coverage summary
        if: env.CODE == 'true'
        shell: bash
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.CODE == 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # catches a VERSION the release workflow would refuse after the merge
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: VERSION releases cleanly
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not a semantic version (expected e.g. 0.1.0)"; exit 1
          fi
          was="$(git show "origin/$BASE:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$version" = "$was" ]; then
            echo "VERSION is still $version, merging to $BASE releases nothing"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error file=VERSION::v$version is already released, so merging would tag nothing. Bump VERSION past it."; exit 1
          fi
          core="${version%%-*}"
          latest="$(git tag --list 'v*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "$latest" ] && ! printf '%s\n%s\n' "${latest#v}" "$core" | sort -V -C; then
            echo "::error file=VERSION::$version is older than the latest release $latest. Bump VERSION past it."; exit 1
          fi
          echo "::notice::merging to $BASE releases v$version (latest is ${latest:-none})"

  vulncheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  snapshot:
    name: snapshot build (all platforms)
    runs-on: ubuntu-latest
    needs: [changes, test, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,docker,publish
      - name: Upload binaries (.exe, .deb, archives)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cream-snapshot-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
          retention-days: 14
