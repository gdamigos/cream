name: Issues to TODO

# keeps one rolling PR from the todo/inbox branch that adds pending bug, feature and enhancement issues to docs/TODO.md
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  push:
    branches: [main]
    paths: [docs/TODO.md]
  workflow_dispatch:

permissions:
  contents: read

# one branch, so one run at a time
concurrency:
  group: issue-todo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      # a PR opened or pushed with GITHUB_TOKEN starts no checks, so a personal token is used when it exists
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TODO_PR_TOKEN || github.token }}
      - name: Rebuild the TODO inbox
        env:
          GH_TOKEN: ${{ secrets.TODO_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        # copied out first because the script switches branches under itself
        run: |
          cp .github/scripts/todo-inbox.sh "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/todo-inbox.sh"
