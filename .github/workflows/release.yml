name: Release

# tag and publish run in one workflow because tags pushed with GITHUB_TOKEN trigger nothing
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Read VERSION and check for an existing tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not a semantic version (expected e.g. 0.1.0)"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already exists - nothing to release. Bump VERSION to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag"
          fi

  test:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  tag:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create and push ${{ needs.prepare.outputs.tag }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)"
          {
            echo "Release $TAG"
            echo
            if [ -n "$prev" ]; then
              echo "Changes from $prev ($(git rev-parse --short "$prev^{commit}")) to $TAG ($(git rev-parse --short "$GITHUB_SHA")):"
              echo
              git log --no-merges --format='- %h %s' "$prev..$GITHUB_SHA"
            else
              echo "Initial release, up to $(git rev-parse --short "$GITHUB_SHA")."
            fi
          } > tag-message.txt
          git tag -a "$TAG" -F tag-message.txt "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  goreleaser:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # cosign and attestations
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Collect commits for the release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="$prev..$TAG"
            summary="Commits $prev...$TAG ($(git rev-parse --short "$prev^{commit}")...$(git rev-parse --short "$TAG^{commit}"))"
          else
            range="$TAG"
            summary="Commits up to $TAG (initial release)"
          fi
          {
            echo "RELEASE_COMMITS<<CREAM_EOF"
            echo "<details><summary>$summary</summary>"
            echo
            git log --no-merges --max-count=300 --format="- [\`%h\`](https://github.com/$REPO/commit/%H) %s" "$range"
            echo
            echo "</details>"
            echo "CREAM_EOF"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # everything below is optional and skipped when unset
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/checksums.txt

  cleanup-on-failure:
    # drop the tag so a rerun can release the same version
    needs: [prepare, tag, goreleaser]
    if: failure() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: git push origin ":refs/tags/$TAG"
